name: Fork Tender
description: >-
  Keep your forks aligned with upstream: detects new upstream commits,
  fast-forwards when safe, and uses Claude to evaluate and merge changes —
  always preserving your fork's local modifications — via reviewable PRs.
author: Eric Mika
branding:
  icon: git-merge
  color: green

inputs:
  anthropic-api-key:
    description: >-
      Anthropic API key. Optional when an ANTHROPIC_API_KEY or
      CLAUDE_CODE_OAUTH_TOKEN env var is set on the action's step; an OAuth
      token is preferred over an API key when both are present.
    required: false
  claude-code-oauth-token:
    description: >-
      Claude subscription OAuth token from `claude setup-token`. Optional when
      a CLAUDE_CODE_OAUTH_TOKEN env var is set on the action's step.
    required: false
  github-token:
    description: >-
      GitHub token for pushes, PRs, and issues. When omitted, the Claude GitHub
      App's short-lived token is used where available (requires `id-token:
      write` and the Claude GitHub App installed), falling back to the
      workflow's GITHUB_TOKEN — note GITHUB_TOKEN-pushed commits do not trigger
      CI on the sync PRs.
    required: false
  model:
    description: Claude model to use
    required: false
    default: claude-opus-5
  config-path:
    description: Path to the fork-tender config file in this repository
    required: false
    default: .github/fork-tender.yml
  max-turns:
    description: Maximum agent turns for the Claude phase
    required: false
    default: '100'
  allowed-bots:
    description: Passed through to claude-code-action; needed when a bot account last edited the workflow cron
    required: false
    default: ''
  dry-run:
    description: Detect and attempt merges locally, but never push, open PRs, or invoke Claude
    required: false
    default: 'false'

outputs:
  outcome:
    description: JSON object mapping each upstream repo to its outcome
    value: ${{ steps.publish.outputs.outcome }}
  pr-urls:
    description: Newline-separated URLs of PRs created or updated
    value: ${{ steps.publish.outputs.pr-urls }}

runs:
  using: composite
  steps:
    - name: Resolve auth
      id: auth
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OAUTH: ${{ inputs.claude-code-oauth-token }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        # Inputs take precedence over env vars; everything is taken at face
        # value, and the OAuth token wins when both kinds are present.
        oauth="${INPUT_OAUTH:-${CLAUDE_CODE_OAUTH_TOKEN:-}}"
        api_key="${INPUT_API_KEY:-${ANTHROPIC_API_KEY:-}}"
        if [[ -z "${oauth}${api_key}" && "$DRY_RUN" != 'true' ]]; then
          echo '::error::fork-tender needs Anthropic auth: set a CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY env var on this step, or pass the corresponding input'
          exit 1
        fi
        if [[ -n "$oauth" ]]; then api_key=''; fi
        {
          printf 'oauth-token=%s\n' "$oauth"
          printf 'api-key=%s\n' "$api_key"
        } >> "$GITHUB_OUTPUT"

    - name: Detect upstream changes
      id: detect
      shell: bash
      env:
        FT_CONFIG_PATH: ${{ inputs.config-path }}
        FT_DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/detect.sh"'

    - name: Restore rerere cache
      if: steps.detect.outputs.needs_sync == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .git/rr-cache
        key: fork-tender-rerere-${{ github.run_id }}
        restore-keys: |
          fork-tender-rerere-

    - name: Fast-forward
      if: steps.detect.outputs.needs_ff == 'true'
      shell: bash
      env:
        FT_DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/ff.sh"'

    - name: Prepare sync branches
      id: prepare
      if: steps.detect.outputs.needs_sync == 'true'
      shell: bash
      env:
        FT_DRY_RUN: ${{ inputs.dry-run }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/prepare.sh"'

    - name: Resolve and evaluate with Claude
      id: claude
      if: steps.prepare.outputs.claude_needed == 'true' && inputs.dry-run != 'true'
      uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1.0.243
      with:
        anthropic_api_key: ${{ steps.auth.outputs.api-key }}
        claude_code_oauth_token: ${{ steps.auth.outputs.oauth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --add-dir ${{ runner.temp }}/fork-tender
          --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git status:*),Bash(git stash:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git rm:*),Bash(git checkout:*),Bash(git switch:*),Bash(git restore:*),Bash(git merge:*),Bash(git cherry-pick:*),Bash(git revert:*),Bash(git commit:*),Bash(git branch:*),Bash(git rev-parse:*),Bash(git rev-list:*),Bash(git merge-base:*),Bash(git ls-files:*),Bash(git describe:*),Bash(git rerere:*),Bash(git grep:*)${{ steps.prepare.outputs.extra_allowed_tools != '' && format(',{0}', steps.prepare.outputs.extra_allowed_tools) || '' }}"

    - name: Mint publish token
      id: publish-token
      if: steps.detect.outputs.needs_sync == 'true' && inputs.github-token == '' && inputs.dry-run != 'true'
      shell: bash
      run: |
        # claude-code-action revokes the app token it minted at the end of its
        # own composite run, so its github_token output is already dead here.
        # Mint a fresh Claude App token for the publish phase: unlike
        # GITHUB_TOKEN, pushes made with it trigger CI on the sync PRs. Every
        # failure mode falls back to the workflow token with a warning.
        fall_back() {
          echo "::warning::[fork-tender] ${1}; publishing with the workflow token, so CI will not run on the sync PRs"
          exit 0
        }
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          fall_back 'workflow lacks `id-token: write`, cannot mint a Claude App token'
        fi
        oidc=$(curl -sSf --max-time 30 \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=claude-code-github-action" \
          | jq -r '.value // empty') || oidc=''
        [[ -n "$oidc" ]] || fall_back 'could not obtain an OIDC token'
        token=$(curl -sSf --max-time 30 -X POST \
          -H "Authorization: Bearer ${oidc}" \
          'https://api.anthropic.com/api/github/github-app-token-exchange' \
          | jq -r '.token // .app_token // empty') || token=''
        [[ -n "$token" ]] || fall_back 'Claude App token exchange failed (is the Claude GitHub App installed on this repository?)'
        echo "::add-mask::${token}"
        printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"

    - name: Publish PRs
      id: publish
      if: steps.detect.outputs.has_work == 'true'
      shell: bash
      env:
        FT_DRY_RUN: ${{ inputs.dry-run }}
        FT_PUSH_TOKEN: ${{ inputs.github-token || steps.publish-token.outputs.token || github.token }}
        GH_TOKEN: ${{ inputs.github-token || steps.publish-token.outputs.token || github.token }}
      run: '"${GITHUB_ACTION_PATH}/scripts/publish.sh"'

    - name: Revoke publish token
      if: always() && steps.publish-token.outputs.token != ''
      shell: bash
      env:
        FT_PUBLISH_TOKEN: ${{ steps.publish-token.outputs.token }}
      run: |
        curl -sS --max-time 10 -X DELETE \
          -H 'Accept: application/vnd.github+json' \
          -H "Authorization: Bearer ${FT_PUBLISH_TOKEN}" \
          "${GITHUB_API_URL:-https://api.github.com}/installation/token" || true
